version: "3"

vars:
  BINARY: pta2svg

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  vet:
    desc: Vet Go code
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  check:
    desc: Format, vet, and test
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: wasm:test

  build:
    desc: Build binary
    cmds:
      - go build -o {{.BINARY}} ./cmd/pta2svg

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}

  deps:tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  wasm:build:
    desc: Build the browser (js/wasm) binary into docs/
    cmds:
      - GOOS=js GOARCH=wasm go build -o docs/pta2svg.wasm ./cmd/pta2svg-wasm
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/wasm_exec.js

  wasm:test:
    desc: Run the js/wasm tests under node
    cmds:
      - PATH="$PATH:$(go env GOROOT)/lib/wasm" GOOS=js GOARCH=wasm go test ./cmd/pta2svg-wasm

  docs:build:
    desc: Generate docs site, including the in-browser demo
    cmds:
      - go run ./cmd/docs
      - task: wasm:build

