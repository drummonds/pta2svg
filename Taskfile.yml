version: "3"

vars:
  BINARY: pta2svg

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  vet:
    desc: Vet Go code
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  check:
    desc: Format, vet, and test
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: deps:guard
      - task: wasm:test
      - task: wasm:tiny:test

  build:
    desc: Build binary
    cmds:
      - go build -o {{.BINARY}} ./cmd/pta2svg

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}

  deps:guard:
    desc: The root package must not link the tree-sitter parsers (keeps the lite wasm small)
    cmds:
      - test -z "$(go list -deps . | grep gotreesitter)"
      - test -z "$(GOOS=js GOARCH=wasm go list -deps ./cmd/pta2svg-wasm-lite | grep gotreesitter)"

  deps:tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  wasm:build:
    desc: Build the browser (js/wasm) binaries into docs/, full and lite
    cmds:
      - GOOS=js GOARCH=wasm go build -o docs/pta2svg.wasm ./cmd/pta2svg-wasm
      - GOOS=js GOARCH=wasm go build -o docs/pta2svg-lite.wasm ./cmd/pta2svg-wasm-lite
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/wasm_exec.js
      - task: wasm:tiny:build

  wasm:tiny:build:
    desc: Build the lite browser binary with TinyGo, beside its own wasm_exec.js
    cmds:
      - tinygo build -target wasm -no-debug -o docs/pta2svg-tiny.wasm ./cmd/pta2svg-wasm-lite
      - cp "$(tinygo env TINYGOROOT)/targets/wasm_exec.js" docs/wasm_exec_tinygo.js

  wasm:test:
    desc: Run the js/wasm tests under node
    cmds:
      - PATH="$PATH:$(go env GOROOT)/lib/wasm" GOOS=js GOARCH=wasm go test ./cmd/pta2svg-wasm ./internal/wasm

  wasm:tiny:test:
    desc: Run what the lite build links under TinyGo (wasm, in node)
    cmds:
      - tinygo test -target wasm . ./internal/wasm ./internal/render

  docs:build:
    desc: Generate docs site, including the in-browser demo
    cmds:
      - go run ./cmd/docs
      - task: wasm:build

