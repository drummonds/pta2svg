<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>pta2svg — Try it</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
<style>
  textarea.source { font-family: monospace; font-size: 0.85rem; min-height: 16rem; }
  .svg-container { display: flex; align-items: center; justify-content: center; overflow-x: auto; min-height: 8rem; }
  .svg-container svg { max-width: 100%; height: auto; }
</style>
<script src="wasm_exec.js"></script>
</head>
<body>
<section class="section">
<div class="container">
  <nav class="breadcrumb">
    <ul><li><a href="index.html">Home</a></li><li class="is-active"><a>Try it</a></li></ul>
  </nav>
  <h1 class="title">Try it</h1>
  <p class="subtitle">pta2svg compiled to WebAssembly: the diagram is drawn in your browser as you type.</p>
  <div class="columns">
    <div class="column is-5">
      <div class="field is-grouped">
        <div class="control">
          <div class="select"><select id="format">
            <option value="goluca">goluca</option>
            <option value="pta">pta</option>
            <option value="beancount">beancount</option>
            <option value="json">json model</option>
          </select></div>
        </div>
        <div class="control">
          <div class="select"><select id="layout">
            <option value="lr">lr</option>
            <option value="sugiyama">sugiyama</option>
          </select></div>
        </div>
        <div class="control">
          <div class="select"><select id="style">
            <option value="">plain</option>
            <option value="afp">afp</option>
          </select></div>
        </div>
        <div class="control"><label class="checkbox"><input type="checkbox" id="animate"> animate</label></div>
      </div>
      <textarea id="source" class="textarea source" spellcheck="false"># One movement drawn with the balances it leaves: the balance directives
# state what each account held before it. Product IDs carry hyphens and a
# name with spaces is quoted.

2026-01-31 balance &#34;Liability:Savings:Alice Lovelace:easy-access&#34; 1000.00 GBP
2026-01-31 balance Expense:Interest 50.00 GBP

2026-01-31 * Interest applied
  Expense:Interest -&gt; &#34;Liability:Savings:Alice Lovelace:easy-access&#34; &#34;interest&#34; 1.27 GBP
</textarea>
      <p id="status" class="help">Loading pta2svg.wasm…</p>
    </div>
    <div class="column is-7">
      <div id="output" class="svg-container box"></div>
    </div>
  </div>
</div>
</section>
<script>
(async () => {
  const status = document.getElementById("status");
  const output = document.getElementById("output");
  const go = new Go();
  const result = await WebAssembly.instantiateStreaming(fetch("pta2svg.wasm"), go.importObject);
  go.run(result.instance); 
  const draw = () => {
    const opts = {
      format: document.getElementById("format").value,
      layout: document.getElementById("layout").value,
      animate: document.getElementById("animate").checked,
      style: document.getElementById("style").value,
    };
    const src = document.getElementById("source").value;
    try {
      output.innerHTML = opts.format === "json" ? pta2svg.renderModel(src, opts) : pta2svg.render(src, opts);
      status.textContent = "";
      status.className = "help";
    } catch (e) {
      status.textContent = String(e.message || e);
      status.className = "help is-danger";
    }
  };
  
  const examples = {text: "# One movement drawn with the balances it leaves: the balance directives\n# state what each account held before it. Product IDs carry hyphens and a\n# name with spaces is quoted.\n\n2026-01-31 balance \"Liability:Savings:Alice Lovelace:easy-access\" 1000.00 GBP\n2026-01-31 balance Expense:Interest 50.00 GBP\n\n2026-01-31 * Interest applied\n  Expense:Interest -\u003e \"Liability:Savings:Alice Lovelace:easy-access\" \"interest\" 1.27 GBP\n", json: "{\n  \"accounts\": [\n    {\n      \"name\": \"Expense:Interest\",\n      \"short\": \"Interest\",\n      \"type\": \"Expense\"\n    },\n    {\n      \"name\": \"Liability:Savings:Alice Lovelace:easy-access\",\n      \"short\": \"easy-access\",\n      \"type\": \"Liability\"\n    }\n  ],\n  \"opening\": {\n    \"Expense:Interest\": 50,\n    \"Liability:Savings:Alice Lovelace:easy-access\": 1000\n  },\n  \"transactions\": [\n    {\n      \"date\": \"\",\n      \"flag\": \"*\",\n      \"payee\": \"Interest applied\",\n      \"movements\": [\n        {\n          \"from\": \"Expense:Interest\",\n          \"to\": \"Liability:Savings:Alice Lovelace:easy-access\",\n          \"amount\": 1.27,\n          \"commodity\": \"GBP\",\n          \"description\": \"interest\"\n        }\n      ]\n    }\n  ]\n}"};
  let shown = document.getElementById("format").value === "json" ? "json" : "text";
  document.getElementById("format").addEventListener("input", (e) => {
    const want = e.target.value === "json" ? "json" : "text";
    if (want !== shown) {
      examples[shown] = document.getElementById("source").value;
      document.getElementById("source").value = examples[want];
      shown = want;
    }
  });
  for (const id of ["source", "format", "layout", "style", "animate"]) {
    document.getElementById(id).addEventListener("input", draw);
  }
  draw();
})();
</script>
</body>
</html>
