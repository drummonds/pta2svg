<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 709 330" width="709" height="330">
<title>Golden</title>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
  </marker>
</defs>
<style>
  .node rect { stroke: #999; stroke-width: 1.5; rx: 6; ry: 6; }
  .node text { font-family: sans-serif; font-size: 13px; fill: #333; text-anchor: middle; dominant-baseline: central; }
  .node .balance { font-size: 10px; fill: #666; text-anchor: end; dominant-baseline: auto; }
  .edge path { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
  .edge text { font-family: sans-serif; font-size: 11px; fill: #555; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .edge text.on-path { dominant-baseline: central; }
  .legend text { font-family: sans-serif; font-size: 11px; fill: #333; dominant-baseline: central; }
  .legend rect { stroke: #999; stroke-width: 1; rx: 3; ry: 3; }
  .node text.name-above { dominant-baseline: auto; }
  .node .balance-below { font-size: 12px; font-weight: bold; fill: #333; dominant-baseline: hanging; }
  @keyframes flow {
    from { stroke-dashoffset: 100; }
    to   { stroke-dashoffset: 0; }
  }
  .edge path { stroke-dasharray: 6 3; animation: flow 1.5s linear infinite; }
</style>

<g class="node" transform="translate(40,120)">
  <rect width="140" height="50" fill="#BCE" style="rx: 25px; ry: 25px; stroke-width: 3px"/>
  <text class="name-above" x="70" y="23">Salary</text>
  <text class="balance-below" x="70" y="27">-£3,000.00</text>
</g>
<g class="node" transform="translate(284.5,120)">
  <rect width="140" height="50" fill="#CDA" style="rx: 25px; ry: 25px"/>
  <text class="name-above" x="70" y="23">Bank</text>
  <text class="balance-below" x="70" y="27">£2,749.50</text>
</g>
<g class="node" transform="translate(529,40)">
  <rect width="140" height="50" fill="#FCC" style="rx: 25px; ry: 25px; stroke-width: 3px"/>
  <text class="name-above" x="70" y="23">Groceries</text>
  <text class="balance-below" x="70" y="27">£85.50</text>
</g>
<g class="node" transform="translate(529,120)">
  <rect width="140" height="50" fill="#FCC" style="rx: 25px; ry: 25px; stroke-width: 3px"/>
  <text class="name-above" x="70" y="23">Utilities</text>
  <text class="balance-below" x="70" y="27">£120.00</text>
</g>
<g class="node" transform="translate(529,200)">
  <rect width="140" height="50" fill="#FCC" style="rx: 25px; ry: 25px; stroke-width: 3px"/>
  <text class="name-above" x="70" y="23">Transport</text>
  <text class="balance-below" x="70" y="27">£45.00</text>
</g>

<g class="edge">
  <path d="M180.0,145.0 L284.5,145.0" style="animation-delay: 0s"/>
  <text x="232.25" y="137">pay</text>
  <text x="232.25" y="159">£3,000.00</text>
</g>
<g class="edge">
  <path d="M424.5,145.0 L529.0,65.0" style="animation-delay: 0.3s"/>
  <text class="on-path" x="476.75" y="98">weekly shop</text>
  <text class="on-path" x="476.75" y="112">£85.50</text>
</g>
<g class="edge">
  <path d="M424.5,145.0 L529.0,145.0" style="animation-delay: 0.6s"/>
  <text x="476.75" y="137">electric bill</text>
  <text x="476.75" y="159">£120.00</text>
</g>
<g class="edge">
  <path d="M424.5,145.0 L529.0,225.0" style="animation-delay: 0.8999999999999999s"/>
  <text class="on-path" x="476.75" y="178">commute</text>
  <text class="on-path" x="476.75" y="192">£45.00</text>
</g>
<g class="legend" transform="translate(20,330)" dy="-30">
  <rect x="0" y="-30" width="14" height="14" fill="#BCE"/>
  <text x="18" y="-23">Income</text>
  <rect x="100" y="-30" width="14" height="14" fill="#CDA"/>
  <text x="118" y="-23">Asset</text>
  <rect x="200" y="-30" width="14" height="14" fill="#FCC"/>
  <text x="218" y="-23">Expense</text>
</g>
</svg>
