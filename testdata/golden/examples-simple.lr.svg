<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 973 371" width="973" height="371">
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
  </marker>
</defs>
<style>
  .node rect { stroke: #999; stroke-width: 1.5; rx: 6; ry: 6; }
  .node text { font-family: sans-serif; font-size: 13px; fill: #333; text-anchor: middle; dominant-baseline: central; }
  .node .balance { font-size: 10px; fill: #666; text-anchor: end; dominant-baseline: auto; }
  .edge path { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
  .edge text { font-family: sans-serif; font-size: 11px; fill: #555; text-anchor: middle; }
  .edge text.on-path { dominant-baseline: central; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .legend text { font-family: sans-serif; font-size: 11px; fill: #333; dominant-baseline: central; }
  .legend rect { stroke: #999; stroke-width: 1; rx: 3; ry: 3; }
</style>

<g class="node" transform="translate(40,40)">
  <rect width="140" height="50" fill="#BCE"/>
  <text x="70" y="25">Salary</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">-10000.00 GBP</text>
</g>
<g class="node" transform="translate(291,40)">
  <rect width="140" height="50" fill="#DDD"/>
  <text x="70" y="25">Mortgage</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">800.00 GBP</text>
</g>
<g class="node" transform="translate(542,40)">
  <rect width="140" height="50" fill="#CDA"/>
  <text x="70" y="25">Bank</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">7000.00 GBP</text>
</g>
<g class="node" transform="translate(793,40)">
  <rect width="140" height="50" fill="#FCC"/>
  <text x="70" y="25">Rent</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">1200.00 GBP</text>
</g>
<g class="node" transform="translate(793,120)">
  <rect width="140" height="50" fill="#FCC"/>
  <text x="70" y="25">Tax</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">1000.00 GBP</text>
</g>

<g class="edge">
  <path d="M110.0,90.0 L110.0,105.0 L612.0,105.0 L612.0,90.0"/>
  <text class="on-path" x="361" y="98">salary payment</text>
  <text class="on-path" x="361" y="112">5000.00 GBP</text>
</g>
<g class="edge">
  <path d="M682.0,65.0 C737.5,65.0 737.5,65.0 793.0,65.0"/>
  <text x="737.5" y="57">monthly rent</text>
  <text x="737.5" y="79">1200.00 GBP</text>
</g>
<g class="edge">
  <path d="M612.0,90.0 L612.0,141.0 L361.0,141.0 L361.0,90.0"/>
  <text class="on-path" x="486.5" y="134">repayment</text>
  <text class="on-path" x="486.5" y="148">800.00 GBP</text>
</g>
<g class="edge">
  <path d="M110.0,90.0 L110.0,177.0 L612.0,177.0 L612.0,90.0"/>
  <text class="on-path" x="361" y="170">net salary</text>
  <text class="on-path" x="361" y="184">4000.00 GBP</text>
</g>
<g class="edge">
  <path d="M110.0,90.0 L110.0,293.0 L863.0,293.0 L863.0,170.0"/>
  <text class="on-path" x="446.5" y="286">income tax</text>
  <text class="on-path" x="446.5" y="300">1000.00 GBP</text>
</g>
<g class="legend" transform="translate(20,371)" dy="-30">
  <rect x="0" y="-30" width="14" height="14" fill="#BCE"/>
  <text x="18" y="-23">Income</text>
  <rect x="100" y="-30" width="14" height="14" fill="#DDD"/>
  <text x="118" y="-23">Liability</text>
  <rect x="200" y="-30" width="14" height="14" fill="#CDA"/>
  <text x="218" y="-23">Asset</text>
  <rect x="300" y="-30" width="14" height="14" fill="#FCC"/>
  <text x="318" y="-23">Expense</text>
</g>
</svg>
