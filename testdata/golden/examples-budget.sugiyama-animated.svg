<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 490" width="748" height="490">
<title>Golden</title>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
  </marker>
</defs>
<style>
  .node rect { stroke: #999; stroke-width: 1.5; rx: 6; ry: 6; }
  .node text { font-family: sans-serif; font-size: 13px; fill: #333; text-anchor: middle; dominant-baseline: central; }
  .node .balance { font-size: 10px; fill: #666; text-anchor: end; dominant-baseline: auto; }
  .edge path { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
  .edge text { font-family: sans-serif; font-size: 11px; fill: #555; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .edge text.on-path { dominant-baseline: central; }
  .legend text { font-family: sans-serif; font-size: 11px; fill: #333; dominant-baseline: central; }
  .legend rect { stroke: #999; stroke-width: 1; rx: 3; ry: 3; }
  .node text.name-above { dominant-baseline: auto; }
  .node .balance-below { font-size: 12px; font-weight: bold; fill: #333; dominant-baseline: hanging; }
  @keyframes flow {
    from { stroke-dashoffset: 100; }
    to   { stroke-dashoffset: 0; }
  }
  .edge path { stroke-dasharray: 6 3; animation: flow 1.5s linear infinite; }
</style>

<g class="node" transform="translate(40,280)">
  <rect width="140" height="50" fill="#BCE" style="rx: 25px; ry: 25px; stroke-width: 3px"/>
  <text class="name-above" x="70" y="23">Salary</text>
  <text class="balance-below" x="70" y="27">-£4,000.00</text>
</g>
<g class="node" transform="translate(304,200)">
  <rect width="140" height="50" fill="#CDA" style="rx: 25px; ry: 25px"/>
  <text class="name-above" x="70" y="23">Bank</text>
  <text class="balance-below" x="70" y="27">£1,180.00</text>
</g>
<g class="node" transform="translate(568,40)">
  <rect width="140" height="50" fill="#DDD" style="rx: 25px; ry: 25px"/>
  <text class="name-above" x="70" y="23">Mortgage</text>
  <text class="balance-below" x="70" y="27">£1,100.00</text>
</g>
<g class="node" transform="translate(568,120)">
  <rect width="140" height="50" fill="#FCC" style="rx: 25px; ry: 25px; stroke-width: 3px"/>
  <text class="name-above" x="70" y="23">Food</text>
  <text class="balance-below" x="70" y="27">£95.00</text>
</g>
<g class="node" transform="translate(568,200)">
  <rect width="140" height="50" fill="#CDA" style="rx: 25px; ry: 25px"/>
  <text class="name-above" x="70" y="23">Savings</text>
  <text class="balance-below" x="70" y="27">£500.00</text>
</g>
<g class="node" transform="translate(568,280)">
  <rect width="140" height="50" fill="#FCC" style="rx: 25px; ry: 25px; stroke-width: 3px"/>
  <text class="name-above" x="70" y="23">Utilities</text>
  <text class="balance-below" x="70" y="27">£145.00</text>
</g>
<g class="node" transform="translate(568,360)">
  <rect width="140" height="50" fill="#FCC" style="rx: 25px; ry: 25px; stroke-width: 3px"/>
  <text class="name-above" x="70" y="23">Tax</text>
  <text class="balance-below" x="70" y="27">£980.00</text>
</g>

<g class="edge">
  <path d="M180.0,305.0 L304.0,225.0" style="animation-delay: 0s"/>
  <text class="on-path" x="242" y="258">net pay</text>
  <text class="on-path" x="242" y="272">£3,200.00</text>
</g>
<g class="edge">
  <path d="M180.0,305.0 L374.0,360.0 L568.0,385.0" style="animation-delay: 0.3s"/>
  <text class="on-path" x="371.09376901528617" y="352.17606853526155">PAYE</text>
  <text class="on-path" x="371.09376901528617" y="366.17606853526155">£800.00</text>
</g>
<g class="edge">
  <path d="M444.0,225.0 L568.0,65.0" style="animation-delay: 0.6s"/>
  <text class="on-path" x="506" y="138">monthly</text>
  <text class="on-path" x="506" y="152">£1,100.00</text>
</g>
<g class="edge">
  <path d="M444.0,225.0 L568.0,145.0" style="animation-delay: 0.8999999999999999s"/>
  <text class="on-path" x="506" y="178">weekly shop</text>
  <text class="on-path" x="506" y="192">£95.00</text>
</g>
<g class="edge">
  <path d="M444.0,225.0 L568.0,225.0" style="animation-delay: 1.2s"/>
  <text x="506" y="217">rainy day</text>
  <text x="506" y="239">£500.00</text>
</g>
<g class="edge">
  <path d="M444.0,225.0 L568.0,305.0" style="animation-delay: 1.5s"/>
  <text class="on-path" x="506" y="258">gas and electric</text>
  <text class="on-path" x="506" y="272">£145.00</text>
</g>
<g class="edge">
  <path d="M444.0,225.0 L568.0,385.0" style="animation-delay: 1.7999999999999998s"/>
  <text class="on-path" x="506" y="298">council tax</text>
  <text class="on-path" x="506" y="312">£180.00</text>
</g>
<g class="legend" transform="translate(20,490)" dy="-30">
  <rect x="0" y="-30" width="14" height="14" fill="#BCE"/>
  <text x="18" y="-23">Income</text>
  <rect x="100" y="-30" width="14" height="14" fill="#CDA"/>
  <text x="118" y="-23">Asset</text>
  <rect x="200" y="-30" width="14" height="14" fill="#DDD"/>
  <text x="218" y="-23">Liability</text>
  <rect x="300" y="-30" width="14" height="14" fill="#FCC"/>
  <text x="318" y="-23">Expense</text>
</g>
</svg>
