<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 290" width="722" height="290">
<title>Golden</title>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
  </marker>
</defs>
<style>
  .node rect { stroke: #999; stroke-width: 1.5; rx: 6; ry: 6; }
  .node text { font-family: sans-serif; font-size: 13px; fill: #333; text-anchor: middle; dominant-baseline: central; }
  .node .balance { font-size: 10px; fill: #666; text-anchor: end; dominant-baseline: auto; }
  .edge path { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
  .edge text { font-family: sans-serif; font-size: 11px; fill: #555; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .edge text.on-path { dominant-baseline: central; }
  .legend text { font-family: sans-serif; font-size: 11px; fill: #333; dominant-baseline: central; }
  .legend rect { stroke: #999; stroke-width: 1; rx: 3; ry: 3; }
  @keyframes flow {
    from { stroke-dashoffset: 100; }
    to   { stroke-dashoffset: 0; }
  }
  .edge path { stroke-dasharray: 6 3; animation: flow 1.5s linear infinite; }
</style>

<g class="node" transform="translate(40,120)">
  <rect width="140" height="50" fill="#BCE"/>
  <text x="70" y="25">Salary</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">-10000.00 GBP</text>
</g>
<g class="node" transform="translate(291,80)">
  <rect width="140" height="50" fill="#CDA"/>
  <text x="70" y="25">Bank</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">7000.00 GBP</text>
</g>
<g class="node" transform="translate(291,160)">
  <rect width="140" height="50" fill="#FCC"/>
  <text x="70" y="25">Tax</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">1000.00 GBP</text>
</g>
<g class="node" transform="translate(542,40)">
  <rect width="140" height="50" fill="#FCC"/>
  <text x="70" y="25">Rent</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">1200.00 GBP</text>
</g>
<g class="node" transform="translate(542,120)">
  <rect width="140" height="50" fill="#DDD"/>
  <text x="70" y="25">Mortgage</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">800.00 GBP</text>
</g>

<g class="edge">
  <path d="M180.0,145.0 L291.0,105.0" style="animation-delay: 0s"/>
  <text class="on-path" x="235.5" y="118">salary payment</text>
  <text class="on-path" x="235.5" y="132">5000.00 GBP</text>
</g>
<g class="edge">
  <path d="M431.0,105.0 L542.0,65.0" style="animation-delay: 0.3s"/>
  <text class="on-path" x="486.5" y="78">monthly rent</text>
  <text class="on-path" x="486.5" y="92">1200.00 GBP</text>
</g>
<g class="edge">
  <path d="M431.0,105.0 L542.0,145.0" style="animation-delay: 0.6s"/>
  <text class="on-path" x="486.5" y="118">repayment</text>
  <text class="on-path" x="486.5" y="132">800.00 GBP</text>
</g>
<g class="edge">
  <path d="M180.0,145.0 L291.0,105.0" style="animation-delay: 0.8999999999999999s"/>
  <text class="on-path" x="235.5" y="118">net salary</text>
  <text class="on-path" x="235.5" y="132">4000.00 GBP</text>
</g>
<g class="edge">
  <path d="M180.0,145.0 L291.0,185.0" style="animation-delay: 1.2s"/>
  <text class="on-path" x="235.5" y="158">income tax</text>
  <text class="on-path" x="235.5" y="172">1000.00 GBP</text>
</g>
<g class="legend" transform="translate(20,290)" dy="-30">
  <rect x="0" y="-30" width="14" height="14" fill="#BCE"/>
  <text x="18" y="-23">Income</text>
  <rect x="100" y="-30" width="14" height="14" fill="#CDA"/>
  <text x="118" y="-23">Asset</text>
  <rect x="200" y="-30" width="14" height="14" fill="#FCC"/>
  <text x="218" y="-23">Expense</text>
  <rect x="300" y="-30" width="14" height="14" fill="#DDD"/>
  <text x="318" y="-23">Liability</text>
</g>
</svg>
