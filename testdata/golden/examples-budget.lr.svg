<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330">
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
  </marker>
</defs>
<style>
  .node rect { stroke: #999; stroke-width: 1.5; rx: 6; ry: 6; }
  .node text { font-family: sans-serif; font-size: 13px; fill: #333; text-anchor: middle; dominant-baseline: central; }
  .node .balance { font-size: 10px; fill: #666; text-anchor: end; dominant-baseline: auto; }
  .edge path { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
  .edge text { font-family: sans-serif; font-size: 11px; fill: #555; text-anchor: middle; }
  .legend text { font-family: sans-serif; font-size: 11px; fill: #333; dominant-baseline: central; }
  .legend rect { stroke: #999; stroke-width: 1; rx: 3; ry: 3; }
</style>

<g class="node" transform="translate(40,40)">
  <rect width="140" height="50" fill="#BCE"/>
  <text x="70" y="25">Salary</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">-4000.00 GBP</text>
</g>
<g class="node" transform="translate(260,40)">
  <rect width="140" height="50" fill="#DDD"/>
  <text x="70" y="25">Mortgage</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">1100.00 GBP</text>
</g>
<g class="node" transform="translate(480,40)">
  <rect width="140" height="50" fill="#CDA"/>
  <text x="70" y="25">Bank</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">1180.00 GBP</text>
</g>
<g class="node" transform="translate(480,120)">
  <rect width="140" height="50" fill="#CDA"/>
  <text x="70" y="25">Savings</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">500.00 GBP</text>
</g>
<g class="node" transform="translate(700,40)">
  <rect width="140" height="50" fill="#FCC"/>
  <text x="70" y="25">Food</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">95.00 GBP</text>
</g>
<g class="node" transform="translate(700,120)">
  <rect width="140" height="50" fill="#FCC"/>
  <text x="70" y="25">Tax</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">980.00 GBP</text>
</g>
<g class="node" transform="translate(700,200)">
  <rect width="140" height="50" fill="#FCC"/>
  <text x="70" y="25">Utilities</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">145.00 GBP</text>
</g>

<g class="edge">
  <path d="M180.0,65.0 C330.0,65.0 330.0,65.0 480.0,65.0"/>
  <text x="330" y="57">net pay</text>
  <text x="330" y="79">3200.00 GBP</text>
</g>
<g class="edge">
  <path d="M180.0,65.0 C440.0,65.0 440.0,145.0 700.0,145.0"/>
  <text x="440" y="97">PAYE</text>
  <text x="440" y="119">800.00 GBP</text>
</g>
<g class="edge">
  <path d="M620.0,65.0 C830.0,-145.0 50.0,-145.0 260.0,65.0"/>
  <text x="440" y="57">monthly</text>
  <text x="440" y="79">1100.00 GBP</text>
</g>
<g class="edge">
  <path d="M620.0,65.0 C660.0,65.0 660.0,65.0 700.0,65.0"/>
  <text x="660" y="57">weekly shop</text>
  <text x="660" y="79">95.00 GBP</text>
</g>
<g class="edge">
  <path d="M620.0,65.0 C720.0,-35.0 380.0,45.0 480.0,145.0"/>
  <text x="550" y="97">rainy day</text>
  <text x="550" y="119">500.00 GBP</text>
</g>
<g class="edge">
  <path d="M620.0,65.0 C660.0,65.0 660.0,225.0 700.0,225.0"/>
  <text x="660" y="137">gas and electric</text>
  <text x="660" y="159">145.00 GBP</text>
</g>
<g class="edge">
  <path d="M620.0,65.0 C660.0,65.0 660.0,145.0 700.0,145.0"/>
  <text x="660" y="97">council tax</text>
  <text x="660" y="119">180.00 GBP</text>
</g>
<g class="legend" transform="translate(20,330)" dy="-30">
  <rect x="0" y="-30" width="14" height="14" fill="#BCE"/>
  <text x="18" y="-23">Income</text>
  <rect x="100" y="-30" width="14" height="14" fill="#DDD"/>
  <text x="118" y="-23">Liability</text>
  <rect x="200" y="-30" width="14" height="14" fill="#CDA"/>
  <text x="218" y="-23">Asset</text>
  <rect x="300" y="-30" width="14" height="14" fill="#FCC"/>
  <text x="318" y="-23">Expense</text>
</g>
</svg>
