<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 709 330" width="709" height="330">
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
  </marker>
</defs>
<style>
  .node rect { stroke: #999; stroke-width: 1.5; rx: 6; ry: 6; }
  .node text { font-family: sans-serif; font-size: 13px; fill: #333; text-anchor: middle; dominant-baseline: central; }
  .node .balance { font-size: 10px; fill: #666; text-anchor: end; dominant-baseline: auto; }
  .edge path { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
  .edge text { font-family: sans-serif; font-size: 11px; fill: #555; text-anchor: middle; }
  .edge text.on-path { dominant-baseline: central; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .legend text { font-family: sans-serif; font-size: 11px; fill: #333; dominant-baseline: central; }
  .legend rect { stroke: #999; stroke-width: 1; rx: 3; ry: 3; }
</style>

<g class="node" transform="translate(40,40)">
  <rect width="140" height="50" fill="#BCE"/>
  <text x="70" y="25">Salary</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">-3000.00 GBP</text>
</g>
<g class="node" transform="translate(284.5,40)">
  <rect width="140" height="50" fill="#CDA"/>
  <text x="70" y="25">Bank</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">2749.50 GBP</text>
</g>
<g class="node" transform="translate(529,40)">
  <rect width="140" height="50" fill="#FCC"/>
  <text x="70" y="25">Groceries</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">85.50 GBP</text>
</g>
<g class="node" transform="translate(529,120)">
  <rect width="140" height="50" fill="#FCC"/>
  <text x="70" y="25">Transport</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">45.00 GBP</text>
</g>
<g class="node" transform="translate(529,200)">
  <rect width="140" height="50" fill="#FCC"/>
  <text x="70" y="25">Utilities</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">120.00 GBP</text>
</g>

<g class="edge">
  <path d="M180.0,65.0 C232.2,65.0 232.2,65.0 284.5,65.0"/>
  <text x="232.25" y="57">pay</text>
  <text x="232.25" y="79">3000.00 GBP</text>
</g>
<g class="edge">
  <path d="M424.5,65.0 C476.8,65.0 476.8,65.0 529.0,65.0"/>
  <text x="476.75" y="57">weekly shop</text>
  <text x="476.75" y="79">85.50 GBP</text>
</g>
<g class="edge">
  <path d="M424.5,65.0 C476.8,65.0 476.8,225.0 529.0,225.0"/>
  <text x="476.75" y="137">electric bill</text>
  <text x="476.75" y="159">120.00 GBP</text>
</g>
<g class="edge">
  <path d="M424.5,65.0 C476.8,65.0 476.8,145.0 529.0,145.0"/>
  <text x="476.75" y="97">commute</text>
  <text x="476.75" y="119">45.00 GBP</text>
</g>
<g class="legend" transform="translate(20,330)" dy="-30">
  <rect x="0" y="-30" width="14" height="14" fill="#BCE"/>
  <text x="18" y="-23">Income</text>
  <rect x="100" y="-30" width="14" height="14" fill="#CDA"/>
  <text x="118" y="-23">Asset</text>
  <rect x="200" y="-30" width="14" height="14" fill="#FCC"/>
  <text x="218" y="-23">Expense</text>
</g>
</svg>
