<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 250" width="696" height="250">
<title>Golden</title>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
  </marker>
</defs>
<style>
  .node rect { stroke: #999; stroke-width: 1.5; rx: 6; ry: 6; }
  .node text { font-family: sans-serif; font-size: 13px; fill: #333; text-anchor: middle; dominant-baseline: central; }
  .node .balance { font-size: 10px; fill: #666; text-anchor: end; dominant-baseline: auto; }
  .edge path { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
  .edge text { font-family: sans-serif; font-size: 11px; fill: #555; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .edge text.on-path { dominant-baseline: central; }
  .legend text { font-family: sans-serif; font-size: 11px; fill: #333; dominant-baseline: central; }
  .legend rect { stroke: #999; stroke-width: 1; rx: 3; ry: 3; }
  .node text.name-above { dominant-baseline: auto; }
  .node .balance-below { font-size: 12px; font-weight: bold; fill: #333; dominant-baseline: hanging; }
  @keyframes flow {
    from { stroke-dashoffset: 100; }
    to   { stroke-dashoffset: 0; }
  }
  .edge path { stroke-dasharray: 6 3; animation: flow 1.5s linear infinite; }
</style>

<g class="node" transform="translate(40,40)">
  <rect width="140" height="50" fill="#EEB" style="rx: 25px; ry: 25px"/>
  <text class="name-above" x="70" y="23">Input</text>
  <text class="balance-below" x="70" y="27">-£25.00</text>
</g>
<g class="node" transform="translate(40,120)">
  <rect width="140" height="50" fill="#BCE" style="rx: 25px; ry: 25px; stroke-width: 3px"/>
  <text class="name-above" x="70" y="23">Sales</text>
  <text class="balance-below" x="70" y="27">-£37.50</text>
</g>
<g class="node" transform="translate(278,80)">
  <rect width="140" height="50" fill="#CDA" style="rx: 25px; ry: 25px"/>
  <text class="name-above" x="70" y="23">Cash</text>
  <text class="balance-below" x="70" y="27">£37.50</text>
</g>
<g class="node" transform="translate(516,80)">
  <rect width="140" height="50" fill="#FCC" style="rx: 25px; ry: 25px; stroke-width: 3px"/>
  <text class="name-above" x="70" y="23">Purchases</text>
  <text class="balance-below" x="70" y="27">£25.00</text>
</g>

<g class="edge">
  <path d="M180.0,65.0 L278.0,105.0" style="animation-delay: 0s"/>
  <text class="on-path" x="229" y="78">investment</text>
  <text class="on-path" x="229" y="92">£25.00</text>
</g>
<g class="edge">
  <path d="M418.0,105.0 L516.0,105.0" style="animation-delay: 0.3s"/>
  <text x="467" y="97">oranges</text>
  <text x="467" y="119">£25.00</text>
</g>
<g class="edge">
  <path d="M180.0,145.0 L278.0,105.0" style="animation-delay: 0.6s"/>
  <text class="on-path" x="229" y="118">market sales</text>
  <text class="on-path" x="229" y="132">£37.50</text>
</g>
<g class="legend" transform="translate(20,250)" dy="-30">
  <rect x="0" y="-30" width="14" height="14" fill="#EEB"/>
  <text x="18" y="-23">Equity</text>
  <rect x="100" y="-30" width="14" height="14" fill="#BCE"/>
  <text x="118" y="-23">Income</text>
  <rect x="200" y="-30" width="14" height="14" fill="#CDA"/>
  <text x="218" y="-23">Asset</text>
  <rect x="300" y="-30" width="14" height="14" fill="#FCC"/>
  <text x="318" y="-23">Expense</text>
</g>
</svg>
