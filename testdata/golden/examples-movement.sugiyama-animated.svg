<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" width="440" height="170">
<title>Golden</title>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
  </marker>
</defs>
<style>
  .node rect { stroke: #999; stroke-width: 1.5; rx: 6; ry: 6; }
  .node text { font-family: sans-serif; font-size: 13px; fill: #333; text-anchor: middle; dominant-baseline: central; }
  .node .balance { font-size: 10px; fill: #666; text-anchor: end; dominant-baseline: auto; }
  .edge path { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
  .edge text { font-family: sans-serif; font-size: 11px; fill: #555; text-anchor: middle; }
  .edge text.on-path { dominant-baseline: central; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .legend text { font-family: sans-serif; font-size: 11px; fill: #333; dominant-baseline: central; }
  .legend rect { stroke: #999; stroke-width: 1; rx: 3; ry: 3; }
  @keyframes flow {
    from { stroke-dashoffset: 100; }
    to   { stroke-dashoffset: 0; }
  }
  .edge path { stroke-dasharray: 6 3; animation: flow 1.5s linear infinite; }
</style>

<g class="node" transform="translate(40,40)">
  <rect width="140" height="50" fill="#FCC"/>
  <text x="70" y="25">Interest</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">48.73 GBP</text>
</g>
<g class="node" transform="translate(260,40)">
  <rect width="140" height="50" fill="#DDD"/>
  <text x="70" y="25">easy-access</text>
  <text class="balance" x="140" y="50" dx="-4" dy="-4">1001.27 GBP</text>
</g>

<g class="edge">
  <path d="M180.0,65.0 L260.0,65.0" style="animation-delay: 0s"/>
  <text class="on-path" x="220" y="58">interest</text>
  <text class="on-path" x="220" y="72">1.27 GBP</text>
</g>
<g class="legend" transform="translate(20,170)" dy="-30">
  <rect x="0" y="-30" width="14" height="14" fill="#FCC"/>
  <text x="18" y="-23">Expense</text>
  <rect x="100" y="-30" width="14" height="14" fill="#DDD"/>
  <text x="118" y="-23">Liability</text>
</g>
</svg>
